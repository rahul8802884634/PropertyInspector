appium:
  server_url: http://127.0.0.1:4723

android:
  platform_name: Android
  automation_name: UiAutomator2
  device_name: Android Emulator
  # Replace these with the PropertyInspector app id and launcher activity.
  app_package: com.propertyinspector
  app_activity: .MainActivity
  # Optional path to an apk. Leave empty to launch an already installed app.
  app_path: ""
  no_reset: false

launch:
  timeout_seconds: 30
  poll_interval_seconds: 0.5
  # Optional. When set, launch also waits until this accessibility id is visible.
  ready_accessibility_id: ""
