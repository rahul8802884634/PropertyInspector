appId: com.ticpropertyinspector.app.staging
name: note_e2e
tags:
  - e2e
  - draft
env:
  CALENDAR_DAY: "11"
  PROPERTY_ADDRESS: "Rougsøvej 2, 8940 Randers SV"
  APP_VERSION: "v1.1.3"
  NOTE_TITLE: "Note Create"
  NOTE_BODY: "new note"
  NOTE_TITLE_UPDATED: "Note Updated"
  NOTE_BODY_UPDATED: "updated note"
---
- runFlow: ../../shared/app/launch_app.yaml
- runFlow: ../../shared/case/open_case.yaml
- runFlow: ../../shared/notes/open_notes.yaml
- runFlow: ../../shared/notes/create_note.yaml
- runFlow: ../../shared/sync/sync_to_legacy.yaml
- runFlow: ../../shared/case/reopen_case.yaml
- runFlow: ../../shared/notes/open_notes.yaml
- runFlow:
    file: ../../shared/helpers/scroll_until.yaml
    env:
      TARGET_TEXT: ${NOTE_TITLE}
